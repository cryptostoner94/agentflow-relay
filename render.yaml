services:
  - type: web
    name: agentflow-relay
    runtime: python
    plan: free

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Generated by Render so the deploy never runs without it. Copy the value
      # from the dashboard to sign in to the admin UI.
      - key: AGENTFLOW_OPERATOR_TOKEN
        generateValue: true
      # Encrypts the credential vault. Without it the vault stores nothing, so
      # stored secrets never rest under a key that is published in this file.
      - key: AGENTFLOW_MASTER_SECRET
        generateValue: true

    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt pytest

    startCommand: |
      PYTHONPATH=backend uvicorn app.main:app --host 0.0.0.0 --port $PORT

    autoDeploy: true
